slam_node:
  ros__parameters:
    # General
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"

    # SLAM-specific parameters
    kiss_slam:
      # Odometry preprocessing — needed so occupancy_mapper.max_range
      # inherits the correct sensor range (40m) instead of the default 100m.
      # The SLAM node doesn't run its own KISS-ICP, but the config loader
      # uses odometry.preprocessing.max_range as the fallback for
      # occupancy_mapper.max_range when max_range is set to -1.0 below.
      odometry:
          preprocessing:
              max_range: 40.0   # MID-360 spec
              min_range: 0.0

      local_mapper:
          voxel_size: 0.2
          splitting_distance: 5.0

      occupancy_mapper:
          free_threshold: 0.5
          occupied_threshold: 0.7
          resolution: 0.2
          max_range: -1.0       # Inherits from odometry.preprocessing.max_range (40.0)
          z_min: 0.10
          z_max: 0.50

      loop_closer:
          detector:
              density_map_resolution: 0.2
              density_threshold: 0.05
              hamming_distance_threshold: 50
              inliers_threshold: 5
          overlap_threshold: 0.4

      pose_graph_optimizer:
          max_iterations: 10
