odometry_node:
  ros__parameters:
    # General
    odom_frame: "odom"
    base_frame: "base_link"

    # KISS-ICP odometry parameters
    kiss_slam:
      odometry:
          preprocessing:
              max_range: 40.0   # MID-360 spec: 40m. Was 50.0 — admits noisy returns past sensor range.
              min_range: 0.0
              deskew: true      # Requires per-point timestamps. MID-360 PointXYZRTLT: 'timestamp' field.
          registration:
              max_num_iterations: 500
              convergence_criterion: 0.0001
              max_num_threads: 0
          adaptive_threshold:
              fixed_threshold: -1.0  # -1.0 = auto
              initial_threshold: 2.0
              min_motion_th: 0.1
